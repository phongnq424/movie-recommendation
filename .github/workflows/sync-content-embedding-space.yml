name: Sync Content Embedding to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/content-embedding/**"
      - "services/recommendation-core/**"
      - "services/deploy/huggingface/content-embedding/**"
      - ".github/workflows/sync-content-embedding-space.yml"

jobs:
  sync-space:
    name: Sync Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Space files
        run: |
          rm -rf .hf-space
          mkdir -p .hf-space

          cp services/deploy/huggingface/content-embedding/README.md .hf-space/README.md
          cp services/deploy/huggingface/content-embedding/Dockerfile .hf-space/Dockerfile

          mkdir -p .hf-space/recommendation-core
          cp services/recommendation-core/pom.xml .hf-space/recommendation-core/pom.xml
          cp -R services/recommendation-core/src .hf-space/recommendation-core/src

          mkdir -p .hf-space/content-embedding
          cp services/content-embedding/pom.xml .hf-space/content-embedding/pom.xml
          cp -R services/content-embedding/src .hf-space/content-embedding/src
          cp -R services/content-embedding/models .hf-space/content-embedding/models

      - name: Install Hugging Face CLI
        run: |
          pip install --upgrade huggingface_hub[cli]

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload pnlaptrinh/content-embedding .hf-space . \
            --repo-type=space \
            --token "$HF_TOKEN" \
            --delete "*"