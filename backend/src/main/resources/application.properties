spring.application.name=movie-recommendation

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false

app.nlp.base-url=${NLP_BASE_URL:http://localhost:8001}

# Recommendation training / ALS
recommendation.training.model-version=als_v1
recommendation.training.factors=64
recommendation.training.max-iter=20
recommendation.training.reg-param=0.08

spring.data.redis.url=${REDIS_URL:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:500ms}

app.recommendation.cache-enabled=${RECOMMENDATION_CACHE_ENABLED:true}
app.recommendation.cache-ttl-minutes=${RECOMMENDATION_CACHE_TTL_MINUTES:30}
app.recommendation.snapshot-size=${RECOMMENDATION_SNAPSHOT_SIZE:100}
app.recommendation.snapshot-ttl-hours=${RECOMMENDATION_SNAPSHOT_TTL_HOURS:12}
app.recommendation.scheduler-enabled=${RECOMMENDATION_SCHEDULER_ENABLED:true}
app.recommendation.cron=${RECOMMENDATION_CRON:0 * * * * *}
